[workspace]
members = ["crates/kanlo-core", "crates/kanlo-db", "crates/kanlo-api"]
resolver = "2"

[workspace.package]
version = "0.2.0-dev.8"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "=1.2.2", features = ["chrono04"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
