name: Quality and Debian builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 -m unittest discover -s tests/release -v
      - run: python3 -m unittest discover -s tests/images -v
      - name: Validate version tag and release channel
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_package.py validate --tag "$RELEASE_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix plugins/kanlo
      - run: npm audit --prefix plugins/kanlo --audit-level=high
      - run: cargo build --locked -p kanlo-api --bin kanlo-server
      - run: npm test --prefix plugins/kanlo
      - run: npm ci --prefix web
      - run: npm audit --prefix web --audit-level=high
      - run: npm run build --prefix web
      - run: git diff --exit-code -- crates/kanlo-api/assets
      - run: npm ci --prefix tests/browser
      - run: npm audit --prefix tests/browser --audit-level=high
      - run: npx --prefix tests/browser playwright install --with-deps chromium --only-shell
      - name: Desktop acceptance with a fresh service instance
        run: npm test --prefix tests/browser -- --project=desktop
      - name: Mobile acceptance with a fresh service instance
        run: npm test --prefix tests/browser -- --project=mobile

  debian-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            compiler: gcc
            package: gcc
            libc_package: libc6-dev
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            compiler: aarch64-linux-gnu-gcc
            package: gcc-aarch64-linux-gnu
            libc_package: libc6-dev-arm64-cross
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf
            compiler: arm-linux-gnueabihf-gcc
            package: gcc-arm-linux-gnueabihf
            libc_package: libc6-dev-armhf-cross
    steps:
      - uses: actions/checkout@v4
      - name: Build in Debian 13
        env:
          TARGET: ${{ matrix.target }}
          CC_TARGET: ${{ matrix.compiler }}
          CC_PACKAGE: ${{ matrix.package }}
          LIBC_PACKAGE: ${{ matrix.libc_package }}
        run: |
          SOURCE_COMMIT=$(git rev-parse HEAD)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_COMMIT SOURCE_DATE_EPOCH
          docker run --rm -v "$PWD:/src" -w /src \
            -e TARGET -e CC_TARGET -e CC_PACKAGE -e LIBC_PACKAGE -e SOURCE_COMMIT -e SOURCE_DATE_EPOCH debian:13-slim sh -ec '
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl build-essential "$CC_PACKAGE" "$LIBC_PACKAGE" file python3
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
              sh /tmp/rustup.sh -y --profile minimal --default-toolchain 1.99.1
              . "$HOME/.cargo/env"
              rustup target add "$TARGET"
              TARGET_KEY=$(printf "%s" "$TARGET" | tr "a-z-" "A-Z_")
              export CC="$CC_TARGET"
              export "CARGO_TARGET_${TARGET_KEY}_LINKER=$CC_TARGET"
              cargo build --workspace --locked --release --target "$TARGET"
              cargo build --workspace --locked --target "$TARGET"
              mkdir -p artifacts
              cp "target/$TARGET/release/kanlo-server" "artifacts/kanlo-server-$TARGET"
              cp "target/$TARGET/debug/kanlo-server" "artifacts/kanlo-server-debug-$TARGET"
              file "artifacts/kanlo-server-$TARGET"
              sha256sum "artifacts/kanlo-server-$TARGET" > "artifacts/kanlo-server-$TARGET.sha256"
              python3 scripts/release_package.py package --binary "artifacts/kanlo-server-$TARGET" --target "$TARGET" --output artifacts
              if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then
                cargo test --workspace --locked --target "$TARGET"
                python3 packaging/tests/package_smoke.py artifacts/kanlo-*-linux-amd64.tar.gz
              fi
            '
      - uses: actions/upload-artifact@v4
        with:
          name: kanlo-dev-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  headless:
    needs: [debian-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kanlo-dev-amd64
          path: artifacts
      - run: docker build -f packaging/tests/Dockerfile.runtime -t kanlo-runtime-validation:debian13 .
      - name: Downloaded package, no network/display, non-root, restart and shutdown
        run: docker run --rm --network none --user kanlo --cap-drop ALL -v "$PWD:/src:ro" -v "$PWD/artifacts:/artifacts:ro" kanlo-runtime-validation:debian13 python3 /src/packaging/tests/package_smoke.py /artifacts

  image-emulator:
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: emulator-cache
        with:
          path: image-tools
          key: kanlo-qemu-${{ runner.os }}-${{ hashFiles('packaging/images/Dockerfile.emulator') }}
      - name: Build pinned upstream emulator with correct Pi watchdog behavior
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p image-tools
          docker build -f packaging/images/Dockerfile.emulator -t kanlo-image-emulator .
          docker run --rm -v "$PWD/image-tools:/out" kanlo-image-emulator
      - uses: actions/upload-artifact@v4
        with:
          name: kanlo-emulator-tools
          path: image-tools/*
          if-no-files-found: error

  appliance-images:
    needs: [quality, debian-build, image-emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: rpi-armhf
            arch: armhf
          - profile: rpi-arm64
            arch: arm64
          - profile: generic-amd64
            arch: amd64
          - profile: generic-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kanlo-dev-${{ matrix.arch }}
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: kanlo-emulator-tools
          path: image-tools
      - name: Enable cross-architecture package configuration
        run: docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm,arm64
      - uses: actions/cache@v4
        with:
          path: image-cache
          key: kanlo-base-${{ matrix.profile }}-${{ hashFiles('packaging/images/bases.json') }}
      - run: docker build -f packaging/images/Dockerfile -t kanlo-image-builder:debian13 .
      - name: Native display on a headless Wayland compositor
        run: |
          docker run --rm --network none --user 65534 -v "$PWD:/src:ro" kanlo-image-builder:debian13 sh -ec '
            XDG_RUNTIME_DIR=$(mktemp -d)
            export XDG_RUNTIME_DIR WLR_BACKENDS=headless WLR_HEADLESS_OUTPUTS=1 WLR_RENDERER=pixman SDL_VIDEODRIVER=wayland SDL_VIDEO_WAYLAND_ALLOW_LIBDECOR=0 LP_NUM_THREADS=2
            SDL_VIDEODRIVER=dummy timeout --kill-after=5s 45s python3 tests/images/display_smoke.py --formats
            timeout --kill-after=5s 45s cage -- python3 tests/images/display_smoke.py
          '
      - name: Build dedicated image and prove two kernel/systemd boots
        env:
          PROFILE: ${{ matrix.profile }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p image-cache image-output
          PACKAGE=$(find artifacts -maxdepth 1 -name "kanlo-*-linux-$ARCH.tar.gz" -print -quit)
          test -n "$PACKAGE"
          docker run --rm --privileged -v "$PWD:/src" -v "$PWD/image-cache:/cache" \
            -v /work kanlo-image-builder:debian13 \
            python3 packaging/images/build.py --profile "$PROFILE" --package "$PACKAGE" --output image-output
      - uses: actions/upload-artifact@v4
        with:
          name: kanlo-image-${{ matrix.profile }}
          path: image-output/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') && github.server_url != 'https://github.com'
    needs: [quality, debian-build, headless, appliance-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: kanlo-dev-*
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: kanlo-image-*
          merge-multiple: true
          path: artifacts
      - name: Verify platform packages and create source bundle/checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_package.py bundle --tag "$RELEASE_TAG" --output artifacts
      - name: Publish only after all assets have been verified
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SERVER_URL: ${{ github.server_url }}
          RELEASE_API_URL: ${{ github.api_url }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_release.py --directory artifacts
